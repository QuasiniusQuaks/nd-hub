# Quality gates for ND-Hub (Issue #92).
# Runs on every PR, push to main, and version tags. Separate from multi-arch image publish.
# Publish waits for this workflow via workflow_run (Issue #109).
#
# Jobs:
#   lint     — ruff (desktop / web / shared) with package configs
#   desktop  — unit tests with PySide6 stub (no display / libEGL)
#   web      — API smoke + security headers (SQLite TestClient)
#   bandit   — medium+ security findings (root .bandit.yml)
#
# Documented ignores (desktop unit, stub-incompatible Qt threading):
#   tests/unit/test_sync_worker.py  — needs real QThreadPool/Signals; stub insufficient
#   Sync-cycle core is covered by tests/unit/test_sync_cycle_core.py (Issue #117).
# Coverage gate: --cov-fail-under=40 (raised from 30; not a 80 jump).

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            desktop-client/requirements-dev.txt
            ndhub-web/requirements.txt

      - name: Install ruff
        run: pip install "ruff>=0.6,<1.0"

      - name: Ruff desktop-client
        run: ruff check desktop-client --config desktop-client/pyproject.toml --exclude "**/tests/**,**/.venv/**,**/__pycache__/**"

      - name: Ruff ndhub-web
        run: ruff check ndhub-web --config ndhub-web/pyproject.toml --exclude "**/tests/**,**/.venv/**,**/node_modules/**,**/__pycache__/**"

      - name: Ruff shared
        run: ruff check shared --config desktop-client/pyproject.toml

  desktop-unit:
    name: Desktop unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            desktop-client/requirements.txt
            desktop-client/requirements-dev.txt

      - name: Install desktop deps (no PySide6 — stub path)
        working-directory: desktop-client
        run: |
          python -m pip install -U pip
          # Runtime deps minus PySide6/matplotlib GUI stack; unit suite uses _pyside6_stub.
          grep -vE '^(PySide6|matplotlib|pywin32)' requirements.txt > /tmp/desktop-ci-req.txt
          pip install -r /tmp/desktop-ci-req.txt
          pip install -r requirements-dev.txt

      - name: Pytest unit (stub-compatible)
        working-directory: desktop-client
        env:
          ND_HUB_FORCE_PYSIDE_STUB: "1"
        run: |
          python -m pytest tests/unit -q \
            --ignore=tests/unit/test_sync_worker.py \
            -m "not performance" \
            --cov=security_manager \
            --cov=db_manager \
            --cov=core.sync_worker \
            --cov=core.secure_token_store \
            --cov=core.config_manager \
            --cov-report=term-missing \
            --cov-fail-under=40

  web-api:
    name: Web API smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ndhub-web/requirements.txt

      - name: Install web backend deps
        working-directory: ndhub-web
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install "pytest>=9.0.3,<10.0" "pytest-cov>=5.0,<7.0" "httpx>=0.28,<1.0" "ruff>=0.6,<1.0"

      - name: Pytest smoke + stable web tests (no libEGL)
        working-directory: ndhub-web
        env:
          PYTHONPATH: backend:..
          ND_HUB_DB_ENGINE: sqlite
        run: |
          python -m pytest \
            backend/tests/test_smoke.py \
            backend/tests/test_security_headers.py \
            backend/tests/test_dockerignore.py \
            backend/tests/test_web_requirements_no_gui.py \
            backend/tests/test_mariadb_password_required.py \
            backend/tests/test_compose_web_bind.py \
            backend/tests/test_schema_sql_literals.py \
            backend/tests/test_shared_lockout.py \
            backend/tests/test_publish_waits_for_ci.py \
            backend/tests/test_web_db_domain_modules.py \
            backend/tests/test_frontend_island_loc.py \
            backend/tests/test_dockerfile_runtime_copy.py \
            -q --tb=short --no-cov \
            -m "not performance"

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: pip install "bandit>=1.7.9,<2.0" "pyyaml>=6.0"

      - name: Bandit scan (medium+)
        run: |
          # Scan production packages only (tests are excluded via .bandit.yml + -x).
          bandit -q \
            -r desktop-client/core desktop-client/backend desktop-client/ui \
               desktop-client/db_manager.py desktop-client/security_manager.py \
               desktop-client/nd_hub.py desktop-client/user_management.py \
               desktop-client/verfall_widget.py desktop-client/verfallmanager.py \
               desktop-client/apple_dashboard.py desktop-client/apple_theme.py \
               desktop-client/icon_manager.py desktop-client/responsive_widgets.py \
               ndhub-web/backend shared \
            -x '*/tests/*,*/test_*.py,**/.venv/**,**/__pycache__/**,**/node_modules/**' \
            -c .bandit.yml \
            -ll -ii


  # Aggregate gate used by branch protection / optional image-publish needs.
  ci-success:
    name: CI success
    if: always()
    needs: [lint, desktop-unit, web-api, bandit]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "desktop=${{ needs.desktop-unit.result }}"
          echo "web=${{ needs.web-api.result }}"
          echo "bandit=${{ needs.bandit.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.desktop-unit.result }}" = "success"
          test "${{ needs.web-api.result }}" = "success"
          test "${{ needs.bandit.result }}" = "success"
